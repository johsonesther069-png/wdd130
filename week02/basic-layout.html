<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Esther Anyanwu">
</head>

<body>
   <header>
       <img src="images/basic-logo.png" alt="Basic HTML logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.byui.edu/">BYU-Idaho</a></li>
            <li><a href="https://www.w3.org/">W3C</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>

        <section>
            <h2>Heading 1</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        </section>

        <section>
            <h2>Heading 2</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        </section>
    </main>
    <aside>
        <img src="images/lagos-temple.jpeg"
             alt="Latter-day Saints temple"
             width="200">
    </aside>
    <footer>
        <p> Esther Anyanwu</p>
    </footer>
</body>
    

</html>
